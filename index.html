<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050c">
<title>Earth Defense Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
</head>
<body>
<canvas id="c" aria-label="지구 방어 전장. 포탑이 자동으로 운석을 요격합니다."></canvas>

<div class="col">
  <header class="top">
    <div class="wave" aria-live="polite"><span class="wl">WAVE</span><b id="wn">1</b><span class="wt">/ 30</span></div>
    <div class="wbar" aria-hidden="true"><i id="wfill"></i></div>
    <div class="tbtns">
      <button type="button" id="codexbtn" aria-label="도감">도감</button>
      <button type="button" id="spd" aria-pressed="false" aria-label="게임 속도">×1</button>
      <button type="button" id="pausebtn" aria-pressed="false" aria-label="일시정지">II</button>
    </div>
  </header>
  <div class="boss" id="boss" hidden><span id="bossname"></span><div class="bbar"><i id="bfill"></i></div></div>
  <div class="banner" id="banner" aria-live="polite"></div>

  <footer class="bottom">
    <div class="meter hp"><span class="ml">FORTRESS</span><div class="mbar"><i id="hpfill"></i></div><b id="hpn">1000</b></div>
    <div class="meter en"><span class="ml">ENERGY</span><div class="mbar"><i id="enfill"></i></div></div>
  </footer>
</div>

<div class="pick" id="pick" hidden role="dialog" aria-modal="true" aria-label="강화 선택">
  <div class="pk-box">
    <h2 class="pk-title">ENERGY FULL</h2>
    <div class="pk-row"></div>
    <p class="pk-hint">카드를 누르거나 1 · 2 · 3</p>
  </div>
</div>

<div class="sheet" id="pausebox" hidden role="dialog" aria-label="일시정지">
  <div class="sheet-box">
    <h2>PAUSED</h2>
    <p class="sheet-sub">지금 빌드</p>
    <ul class="build" id="build"></ul>
    <div class="sheet-btns"><button type="button" id="resume" class="primary">계속하기</button><button type="button" id="restart">처음부터</button></div>
    <button type="button" id="pcodex" class="wide">도감 · 무기와 적</button>
    <details class="stage" id="stage">
      <summary>테스트 · 스테이지 선택</summary>
      <div class="st-body">
        <p class="st-label">시작 웨이브 <b id="stwave">1</b></p>
        <div class="st-grid" id="stgrid" role="group" aria-label="시작 웨이브"></div>
        <p class="st-label">시점</p>
        <div class="st-seg" id="stview" role="radiogroup" aria-label="시점">
          <button type="button" role="radio" data-v="" aria-checked="true">자동</button>
          <button type="button" role="radio" data-v="line" aria-checked="false">전선</button>
          <button type="button" role="radio" data-v="half" aria-checked="false">반구</button>
          <button type="button" role="radio" data-v="full" aria-checked="false">360°</button>
        </div>
        <p class="st-label">건너뛴 웨이브의 카드</p>
        <div class="st-seg" id="stcards" role="radiogroup" aria-label="건너뛴 웨이브의 카드">
          <button type="button" role="radio" data-v="auto" aria-checked="true">자동 선택</button>
          <button type="button" role="radio" data-v="manual" aria-checked="false">직접 고르기</button>
          <button type="button" role="radio" data-v="none" aria-checked="false">받지 않기</button>
        </div>
        <button type="button" id="stgo" class="primary">이 스테이지로 시작</button>
      </div>
    </details>
    <a class="classic" href="./classic.html">클래식 모드 (예전 버전) →</a>
  </div>
</div>

<div class="codex" id="codex" hidden role="dialog" aria-modal="true" aria-label="도감">
  <div class="cx-box">
    <header class="cx-head">
      <h2>CODEX</h2>
      <div class="cx-tabs" role="tablist"><button type="button" role="tab" data-tab="weapons" aria-selected="true">무기</button><button type="button" role="tab" data-tab="rocks" aria-selected="false">적</button></div>
      <button type="button" class="cx-close">닫기</button>
    </header>
    <div class="cx-list" id="cxlist"></div>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>

<div class="sheet over" id="over" hidden role="dialog" aria-label="결과">
  <div class="sheet-box">
    <h2>FORTRESS DOWN</h2>
    <p class="osub"></p>
    <div class="ostats"></div>
    <ul class="build obuild"></ul>
    <div class="sheet-btns"><button type="button" id="again" class="primary">다시 하기</button></div>
  </div>
</div>

<script type="module" src="/src/td/main.js"></script>
</body>
</html>
