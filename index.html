<title>원소 마법 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Black+Han+Sans&family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: pure black full-bleed canvas; class tabs + skill bar pinned to the bottom edge */
:root{
  color-scheme: dark;
  --void:#000;
  --panel:rgba(16,14,14,.88);
  --bone:#eadfce;
  --ash:#8d8479;
  --line:rgba(234,223,206,.13);
  --fire:#ff8a3d; --ice:#7cc8ff; --bolt:#b0adff;
  --bow:#e6d3a8; --poison:#8fe35a; --holy:#ffd36a; --magic:#8fc2ff;
  --display:'Cinzel', 'Times New Roman', serif;
  --ko:'Gowun Batang', 'Nanum Myeongjo', serif;
  --ui:'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--ui);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));}
.top p{margin:0;font-size:12px;color:var(--ash);line-height:1.5}
.top b{font-weight:500;color:var(--bone)}
.credit{font-size:10px;opacity:.7}
.stats{font-size:11px;color:var(--ash);font-variant-numeric:tabular-nums;white-space:nowrap}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.btns{display:flex;gap:6px}
.ehp{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ash);font-variant-numeric:tabular-nums;flex:0 1 260px;min-width:0}
.ehpbar{flex:1;min-width:40px;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.ehpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3d8be0,#7cd2ff);transition:width .2s}
.ehpbar i.low{background:linear-gradient(90deg,#c0392b,#ff7a5c)}
.over{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);z-index:5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.over[hidden]{display:none}
.over .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 26px;text-align:center;display:grid;gap:10px;max-width:340px}
.over h2{margin:0;font-family:var(--ko);font-size:20px}
.over p{margin:0;color:var(--ash);font-size:12px;font-variant-numeric:tabular-nums}
.over .respawn{justify-self:center;font-size:13px;padding:7px 16px}
@media (max-width:620px){ .top{flex-wrap:wrap} .ehp{order:3;flex-basis:100%} }
.respawn{pointer-events:auto;appearance:none;font:inherit;font-size:11px;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer}
.respawn:hover{border-color:rgba(234,223,206,.4)}
.respawn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

.bar{position:fixed;left:0;right:0;bottom:0;padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(to top, rgba(0,0,0,.92) 60%, rgba(0,0,0,0));}
.handrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:14px;max-width:1100px;margin:0 auto 8px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.handrow .prog{align-self:end;padding-bottom:6px}
.bagwrap{display:flex;justify-content:flex-end;align-items:end;padding-bottom:6px}
.bagbtn{appearance:none;font:inherit;font-size:13px;color:var(--bone);background:linear-gradient(180deg,#2b2420,#17120f);border:1px solid #5a4a3a;border-radius:6px;padding:8px 14px;cursor:pointer;position:relative}
.bagbtn b{font-weight:500;color:var(--holy);margin-left:4px}
.bagbtn.new::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#ff7a3c;box-shadow:0 0 8px #ff7a3c}
.bagbtn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.hand{display:flex;justify-content:center;align-items:flex-end;padding:14px 10px 12px}
.card{appearance:none;font:inherit;border:0;padding:0;background:none;cursor:pointer;width:74px;height:100px;position:relative;flex:none;color:var(--bone);text-align:center}
.hand .card{margin:0 -5px;transform:translateY(var(--lift)) rotate(var(--rot));transform-origin:50% 130%;transition:transform .16s ease, filter .16s;z-index:var(--z)}
.hand .card:not(.locked):hover,.hand .card:focus-visible{transform:translateY(calc(var(--lift) - 16px)) rotate(0deg) scale(1.08);z-index:30}
.card:focus-visible{outline:none}
.card:focus-visible .cframe{box-shadow:0 0 0 2px var(--bone)}
.cframe{position:absolute;inset:0;border-radius:9px;background:linear-gradient(180deg,#2e2621,#16110e);border:2px solid var(--rc);
  box-shadow:0 8px 16px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.cart{width:calc(100% - 10px);height:47px;margin-top:5px;border-radius:44% 44% 7px 7px / 34% 34% 7px 7px;border:1px solid rgba(0,0,0,.7);
  background:radial-gradient(circle at 50% 58%, color-mix(in srgb,var(--c) 55%,white) 0, var(--c) 20%, color-mix(in srgb,var(--c) 32%,#000) 58%, #090707 100%);
  display:grid;place-items:center;box-shadow:inset 0 0 10px rgba(0,0,0,.85)}
.cart i{font-style:normal;font-family:var(--ko);font-weight:700;font-size:20px;color:#fff;text-shadow:0 0 10px var(--c),0 1px 2px #000}
.crar{position:absolute;top:48px;left:50%;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--rc);border:1px solid #000;box-shadow:0 0 6px var(--rc)}
.cname{margin-top:6px;width:calc(100% + 4px);background:linear-gradient(180deg,#40352d,#261e19);border-block:1px solid rgba(0,0,0,.65);
  font-family:var(--ko);font-weight:700;font-size:10.5px;line-height:1.15;padding:3px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctype{font-size:9px;color:var(--ash);margin-top:auto;margin-bottom:6px}
.cplus{position:absolute;right:5px;top:4px;font-size:10px;font-weight:700;color:var(--holy);text-shadow:0 1px 2px #000,0 0 4px #000}
.cgem{position:absolute;left:-6px;top:-6px;width:22px;height:22px;border-radius:50%;z-index:2;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#8cc0ff,#1d4aa3);border:2px solid #0b0b10;color:#fff;font-size:11px;font-weight:700}
.card.empty .cframe{background:rgba(255,255,255,.03);border:2px dashed rgba(234,223,206,.28);box-shadow:none;justify-content:center;color:var(--ash);font-size:11px}
.card.locked{cursor:default}
.card.locked .cframe{background:repeating-linear-gradient(45deg,#1e1a28 0 6px,#17131f 6px 12px);border-color:#3c3552;justify-content:center}
.lockt{font-size:11px;color:#8d85ab;font-variant-numeric:tabular-nums}
.card.mini{transition:transform .12s}
.card.mini:hover{transform:translateY(-3px)}
.card.mini.sel .cframe{box-shadow:0 0 0 2px var(--holy), 0 8px 16px rgba(0,0,0,.6)}
.bigcard{width:148px;height:200px;flex:none}
.card.big{display:block;width:74px;height:100px;transform:scale(2);transform-origin:0 0;pointer-events:none}
.hist{position:fixed;right:max(16px, env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 108px);width:200px;display:grid;gap:6px;pointer-events:none;z-index:3}
.hitem{display:grid;gap:1px;padding:6px 10px 6px 12px;background:rgba(12,10,10,.78);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--c);border-radius:4px;
  font-size:12px;animation:hin .25s ease-out, hdim .6s 8s forwards}
.hitem b{font-weight:500;color:var(--c)}
.hitem span{font-size:10.5px;color:var(--ash)}
@keyframes hin{from{opacity:0;transform:translateX(12px)}}
@keyframes hdim{to{opacity:.42}}
.dlg{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#141110;border:1px solid #4a3d32;border-radius:8px;padding:18px;display:flex;gap:20px;align-items:flex-start;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.dlg.pick{flex-direction:column;align-items:stretch;gap:12px;width:min(640px,100%)}
.dinfo{flex:1;min-width:0;display:grid;gap:8px}
.dhead{display:flex;align-items:center;gap:10px}
.dslot{flex:1;font-size:12px;color:var(--ash);letter-spacing:.04em}
.dlg h2,.bdetail h2{margin:0;font-family:var(--ko);font-size:20px}
.dlg h2 small,.bdetail h2 small{font-size:14px;color:var(--holy)}
.dmeta{font-size:12px;color:var(--ash)}
.dlines{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px;color:#a9c3ff}
.dlines li:first-child{color:var(--bone)}
.dup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.dacts{display:flex;gap:6px;margin-top:4px}
.pbtn.ghost{background:none;border-color:transparent;color:var(--ash)}
.pbtn.ghost:hover{color:var(--bone)}
.pbtn.num{width:32px;padding:6px 0;text-align:center}
.note{margin:0;font-size:12px;color:var(--ash)}
.pbody h4,.dlg h4{margin:6px 0 6px;font-size:11px;font-weight:500;color:var(--ash);letter-spacing:.06em}
.cgrid{display:flex;flex-wrap:wrap;gap:12px 10px;padding:6px 6px 4px}
.inv{position:fixed;inset:0;z-index:7;background:rgba(6,5,5,.94);display:grid;place-items:center;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px}
.inv[hidden]{display:none}
.bag{width:min(920px,100%);height:min(640px,calc(100vh - 40px));display:flex;flex-direction:column;gap:12px;background:#141110;border:1px solid #4a3d32;border-radius:8px;padding:18px}
.bhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bhead h2{margin:0;font-family:var(--ko);font-size:20px;flex:none}
.bhead h2 span{font-size:13px;color:var(--ash);font-weight:400}
.bmats{flex:1;font-size:12px;color:var(--ash);font-variant-numeric:tabular-nums}
.bmats b{color:var(--bone);font-weight:500}
.bbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.blist{min-width:0;overflow:auto}
.bdetail{min-width:0;overflow:auto;display:grid;gap:8px;align-content:start;border-left:1px solid var(--line);padding-left:16px}
.bdetail .bigcard{justify-self:center;margin-bottom:6px}
.eqrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ash);flex-wrap:wrap}
@media (max-width:720px){
  .handrow{grid-template-columns:1fr auto;gap:8px 10px}
  .handrow .prog{grid-column:1 / -1;order:-1;padding-bottom:0}
  .hand{justify-content:flex-start;padding-left:4px}
  .card{width:58px;height:80px}
  .cart{height:36px} .cart i{font-size:16px} .crar{top:37px}
  .cname{font-size:9px} .ctype{font-size:8px;margin-bottom:4px}
  .hist{width:150px;top:calc(env(safe-area-inset-top,0px) + 96px)}
  .dlg{flex-direction:column;align-items:center}
  .bbody{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .bdetail{border-left:0;border-top:1px solid var(--line);padding:12px 0 0;max-height:46vh}
}
.mats{display:flex;gap:10px;font-size:11px;color:var(--ash);font-variant-numeric:tabular-nums;white-space:nowrap}
.mats b{color:var(--bone);font-weight:500}
.m-metal b{color:#8ccdff} .m-core b{color:#ffa646}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-6px);opacity:0;pointer-events:none;
  font-size:13px;font-weight:500;color:var(--bone);background:rgba(10,8,8,.85);border:1px solid var(--line);border-radius:3px;padding:6px 12px;
  transition:opacity .2s, transform .2s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;z-index:4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.panel{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.6);display:grid;place-items:center;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px}
.panel[hidden]{display:none}
.pcard{width:min(440px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#121010;border:1px solid var(--line);border-radius:5px;padding:16px;display:grid;gap:12px}
.ptop{display:flex;justify-content:space-between;align-items:center}
.pcard h2{margin:0;font-family:var(--ko);font-size:18px}
.pcard h3{margin:4px 0 0;font-size:12px;font-weight:500;color:var(--ash);letter-spacing:.04em}
.pcard h3 span{color:var(--bone)}
.plist{display:grid;gap:8px}
.icard{border:1px solid color-mix(in srgb, var(--rc) 45%, transparent);border-radius:4px;padding:10px 12px;background:color-mix(in srgb, var(--rc) 6%, #0d0b0b);display:grid;gap:4px}
.ihead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.iname{color:var(--rc);font-family:var(--ko);font-weight:700;font-size:15px}
.imeta{font-size:11px;color:var(--ash)}
.icard .base{font-size:12px;color:var(--bone)}
.icard .afx{font-size:12px;color:#8fb2ff}
.icard .afx.dim{color:var(--ash)}
.acts{display:flex;gap:6px;margin-top:6px}
.pbtn{appearance:none;font:inherit;font-size:12px;color:var(--bone);background:#1c1818;border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer}
.pbtn.primary{border-color:rgba(255,211,106,.55);color:var(--holy)}
.pbtn:disabled{opacity:.4;cursor:default}
.pbtn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.cost{font-size:11px;color:var(--ash)} .cost.short{color:#e07b6a}
.pmats{font-size:11px;color:var(--ash);font-variant-numeric:tabular-nums}
.pmats b{color:var(--bone);font-weight:500}
.empty-note{margin:0;font-size:12px;color:var(--ash)}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.ptab{appearance:none;font:inherit;font-size:13px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ash);padding:6px 10px;cursor:pointer;margin-bottom:-1px}
.ptab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--holy)}
.ptab span{font-size:11px;color:var(--ash)}
.ptab:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.skgroup{display:grid;gap:6px}
.skgroup h4{margin:0;font-size:11px;font-weight:500;color:var(--ash);letter-spacing:.06em}
.skgrid{display:flex;flex-wrap:wrap;gap:6px}
.skchip{appearance:none;font:inherit;font-family:var(--ko);font-size:13px;font-weight:700;color:var(--rc);background:color-mix(in srgb, var(--rc) 8%, #0f0d0d);
  border:1px solid color-mix(in srgb, var(--rc) 40%, transparent);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.skchip small{font-family:var(--ui);font-size:10px;font-weight:400;color:var(--ash)}
.skchip.on{background:color-mix(in srgb, var(--rc) 22%, #0f0d0d);border-color:var(--rc)}
.skchip:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.prog{flex:1 1 240px;min-width:0;display:grid;gap:5px}
.xp{display:flex;align-items:center;gap:10px;
  font-size:11px;color:var(--ash);font-variant-numeric:tabular-nums}
.xp .lv{font-family:var(--display);font-weight:700;color:var(--holy);letter-spacing:.08em;white-space:nowrap}
.xpbar{flex:1;min-width:0;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c98a2a,var(--holy));transition:width .15s}
.xp .xpt{white-space:nowrap}
.scroller{overflow-x:auto;scrollbar-width:none;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));}
.scroller::-webkit-scrollbar{display:none}
.inner{width:max-content;margin-inline:auto;display:flex;flex-direction:column;gap:9px}
.tabs{display:flex;gap:4px}
.tab{appearance:none;font:inherit;background:none;border:0;border-bottom:1px solid transparent;color:var(--ash);cursor:pointer;
  padding:4px 10px 5px;display:flex;align-items:baseline;gap:7px}
.tab .en{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.tab .ko{font-family:var(--ko);font-size:12px}
.tab kbd{font-family:var(--ui);font-size:10px;opacity:.7}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--bone)}
.tab:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.row{display:flex;gap:6px}

.spell{appearance:none;font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:3px;
  width:100px;padding:9px 9px 10px;text-align:left;display:grid;gap:3px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .15s, background .15s, box-shadow .15s}
.spell:hover{border-color:color-mix(in srgb, var(--elem) 55%, transparent)}
.spell:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.spell[aria-pressed="true"]{border-color:var(--elem);background:color-mix(in srgb, var(--elem) 15%, #0c0a0a);
  box-shadow:inset 0 0 0 1px var(--elem), 0 0 22px -6px var(--elem)}
.spell kbd{position:absolute;top:7px;right:8px;font-family:var(--ui);font-size:10px;color:var(--ash)}
.spell .gem{width:7px;height:7px;transform:rotate(45deg);background:var(--elem);box-shadow:0 0 8px var(--elem);margin-bottom:3px}
.spell .ko{font-family:var(--ko);font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap}
.spell .en{font-family:var(--display);font-size:9.5px;letter-spacing:.06em;color:var(--ash);white-space:nowrap}
.spell .cd{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--elem);transform-origin:left;transform:scaleX(0);opacity:.85}
.e-fire{--elem:var(--fire)} .e-ice{--elem:var(--ice)} .e-bolt{--elem:var(--bolt)}
.e-bow{--elem:var(--bow)} .e-poison{--elem:var(--poison)} .e-holy{--elem:var(--holy)} .e-magic{--elem:var(--magic)}
.e-gun{--elem:#f4c460} .e-steel{--elem:#cfd6e2} .e-rage{--elem:#ff5a6a} .e-shout{--elem:#ffb347}
.e-bone{--elem:#e8e0cc} .e-spirit{--elem:#7fe0d8} .e-blood{--elem:#e5463c}
@media (max-width:520px){ .spell{width:90px} .top p{font-size:11px} }

/* ===== Retro jazz-noir skin: worn paper, ink, amber and rust. Original design; inspired by 70s print and used-future sci-fi ===== */
:root{
  --void:#0d0907; --panel:rgba(24,17,13,.9); --bone:#efe2c6; --ash:#a08d74; --line:rgba(239,226,198,.16);
  --amber:#e8a33d; --rust:#c4512b; --teal:#2f8f8a; --ink:#17110d; --paper:#e7dabd; --paper2:#d9c9a6; --holy:#e8a33d;
  --display:'Alfa Slab One', 'Rockwell', Georgia, serif;
  --ko:'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono:'Courier Prime', 'Nanum Gothic Coding', ui-monospace, monospace;
}
body{background:var(--void)}
@media (pointer:fine){ #c{filter:sepia(.07) saturate(.96) contrast(1.05)} }
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:20;opacity:.075;mix-blend-mode:overlay;background-image:var(--grain);background-size:180px 180px;animation:grain .5s steps(4) infinite}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:19;background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(8,5,3,.55) 100%)}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-1%,-2%)}}
@media (prefers-reduced-motion: reduce){ .grain{animation:none} }

/* top HUD */
.top p{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--ash)}
.top b{color:var(--amber);font-weight:700}
.credit{font-family:var(--mono)}
.stats{font-family:var(--mono);color:var(--ash)}
.ehp{font-family:var(--mono);font-size:11px;color:var(--bone);letter-spacing:.08em}
.ehp > span:first-child{color:var(--amber);font-weight:700}
.ehpbar{height:8px;border-radius:0;background:repeating-linear-gradient(90deg, rgba(239,226,198,.12) 0 1px, transparent 1px 10%), rgba(239,226,198,.06);border:1px solid rgba(239,226,198,.35)}
.ehpbar i{background:var(--teal)}
.ehpbar i.low{background:var(--rust)}
.respawn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--amber);background:rgba(13,9,7,.75);border:1.5px solid var(--amber);border-radius:2px;padding:5px 10px}
.respawn:hover{background:var(--amber);color:var(--ink)}

/* bottom bar */
.bar{background:linear-gradient(to top, rgba(13,9,7,.97) 55%, rgba(13,9,7,0))}
.xp{font-family:var(--mono)}
.xp .lv{font-family:var(--display);font-weight:400;color:var(--amber);letter-spacing:.04em}
.xpbar{height:6px;border-radius:0;background:rgba(239,226,198,.08);border:1px solid rgba(239,226,198,.25)}
.xpbar i{background:var(--amber)}
.mats{font-family:var(--mono);font-size:11px}
.m-metal b{color:#7fc4c0} .m-core b{color:var(--rust)}
.tab .en{font-family:var(--display);font-weight:400;letter-spacing:.12em}
.tab .ko{font-family:var(--ko)}
.tab[aria-selected="true"]{color:var(--amber);border-bottom:2px solid var(--amber)}
.spell{background:linear-gradient(180deg,#2a1e17,#1a120e);border:1px solid rgba(239,226,198,.14);border-left:4px solid var(--elem);border-radius:2px}
.spell .gem{display:none}
.spell .ko{font-family:var(--ko);font-weight:400;font-size:14px;letter-spacing:.01em}
.spell .en{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em}
.spell kbd{font-family:var(--mono)}
.spell[aria-pressed="true"]{background:linear-gradient(180deg,#3a2a1f,#22170f);border-color:var(--elem);box-shadow:0 0 0 1px var(--elem)}
.bagbtn{font-family:var(--mono);font-weight:700;letter-spacing:.06em;color:var(--ink);background:var(--amber);border:2px solid var(--ink);border-radius:2px;box-shadow:3px 3px 0 #000}
.bagbtn b{color:var(--ink)}
.bagbtn.new::after{background:var(--rust);box-shadow:none;border:2px solid var(--ink);width:11px;height:11px}

/* cards: worn paper bounty cards with hard print shadow */
.cframe{border-radius:3px;border:2px solid var(--ink);background:var(--paperg) 0 0/180px 180px, var(--paper);box-shadow:3px 4px 0 #000;color:var(--ink)}
.cframe::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--rc)}
.cart{margin-top:9px;height:44px;width:calc(100% - 12px);border-radius:1px;border:2px solid var(--ink);box-shadow:none;
  background:radial-gradient(circle, rgba(0,0,0,.28) .9px, transparent 1.3px) 0 0/4px 4px,
             radial-gradient(circle at 50% 56%, var(--c) 0 36%, color-mix(in srgb,var(--c) 45%,var(--ink)) 37% 52%, transparent 53%), #231a14}
.cart i{font-family:var(--ko);font-weight:400;font-size:19px;color:var(--paper);text-shadow:2px 2px 0 var(--ink)}
.crar{display:none}
.cframe::before{height:6px;border-bottom:2px solid var(--ink)}
.card{height:108px}
.cart{height:40px !important}
.cname{margin-top:5px;background:none;border:0;border-top:1px dashed rgba(23,17,13,.5);width:calc(100% - 8px);color:var(--ink);font-family:var(--ko);font-weight:400;font-size:10.5px;letter-spacing:-.02em;padding:4px 1px 0}
.ctype{font-family:var(--mono);font-size:8.5px;color:#6a563f;text-transform:uppercase;letter-spacing:.04em}
.cplus{top:7px;right:5px;font-family:var(--mono);color:var(--paper);background:var(--rust);padding:0 3px;text-shadow:none;border:1px solid var(--ink)}
.cgem{border-radius:2px;width:22px;height:20px;background:var(--ink);color:var(--amber);border:2px solid var(--paper);font-family:var(--mono);font-size:12px;transform:rotate(-6deg);left:-7px;top:-7px}
.card.empty .cframe{background:rgba(20,14,10,.9);border:2px dashed rgba(232,163,61,.6);box-shadow:3px 4px 0 #000;color:var(--amber);font-family:var(--mono);font-size:10px}
.card.empty .cframe::before,.card.locked .cframe::before{display:none}
.card.locked .cframe{background:repeating-linear-gradient(-45deg, rgba(232,163,61,.16) 0 7px, rgba(13,9,7,.9) 7px 14px);border:2px solid rgba(232,163,61,.4);box-shadow:none}
.lockt{font-family:var(--mono);font-weight:700;color:var(--amber);background:var(--ink);padding:1px 5px}
.card:focus-visible .cframe{box-shadow:0 0 0 2px var(--amber), 3px 4px 0 #000}
.card.mini.sel .cframe{box-shadow:0 0 0 3px var(--rust), 3px 4px 0 #000}

/* dialogs + bag: a dossier sheet */
.panel{background:rgba(8,5,3,.72)}
.dlg,.bag{background:var(--paperg) 0 0/180px 180px, var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:2px;box-shadow:8px 8px 0 #000}
.dlg h2,.bdetail h2,.bhead h2{font-family:var(--ko);font-weight:400;font-size:24px;color:var(--ink) !important;letter-spacing:.01em}
.dlg h2 small,.bdetail h2 small{color:var(--rust)}
.dslot,.dmeta,.bmats,.note,.eqrow{font-family:var(--mono);color:#6a563f}
.bmats b{color:var(--ink)}
.bhead h2 span{color:#6a563f}
.dlines{font-family:var(--mono);font-size:12.5px;color:#2a5a6e}
.dlines li{border-bottom:1px dotted rgba(23,17,13,.25);padding-bottom:3px}
.dlines li:first-child{color:var(--ink)}
.dlines li::before{content:"▸ ";color:var(--rust)}
.pbtn{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--paper);background:var(--ink);border:2px solid var(--ink);border-radius:2px}
.pbtn:hover:not(:disabled){background:#2c2119}
.pbtn.primary{background:var(--rust);border-color:var(--ink);color:var(--paper)}
.pbtn.primary:hover:not(:disabled){background:#d8623a}
.pbtn.ghost{background:none;border-color:transparent;color:#6a563f}
.pbtn.ghost:hover{color:var(--ink);background:none}
.pbtn:focus-visible{outline:2px solid var(--rust)}
.cost{font-family:var(--mono);color:#6a563f} .cost.short{color:#a8341a}
.ptabs{border-bottom:2px solid var(--ink)}
.ptab{font-family:var(--mono);font-weight:700;color:#6a563f;border-bottom:3px solid transparent}
.ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rust)}
.ptab span{color:#6a563f}
.pbody h4,.dlg h4{font-family:var(--mono);color:#6a563f;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px dashed rgba(23,17,13,.35);padding-bottom:3px}
.bdetail{border-left:2px dashed rgba(23,17,13,.35)}
.inv{background:rgba(8,5,3,.86)}
@media (max-width:720px){ .bdetail{border-left:0;border-top:2px dashed rgba(23,17,13,.35)} .card{height:86px} .cart{height:32px !important} }

/* history: a teletype log */
.hitem{font-family:var(--mono);background:rgba(16,11,8,.88);border:1px solid rgba(239,226,198,.12);border-left:4px solid var(--c);border-radius:0}
.hitem b{font-weight:700;color:var(--bone)}
.hitem b::before{content:"▸ ";color:var(--c)}
.hitem span{color:var(--ash);font-size:10px}

/* game over */
.over .card{background:var(--paperg) 0 0/180px 180px, var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:2px;box-shadow:8px 8px 0 #000}
.over h2{font-family:var(--ko);font-weight:400;font-size:26px}
.over p{font-family:var(--mono);color:#6a563f}
.over .respawn{background:var(--rust);color:var(--paper);border-color:var(--ink)}

/* ===== bottom HUD: two orbs, the hand, manual skill + bag ===== */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"hp mid right mp";align-items:end;gap:8px 16px;max-width:1180px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.orbbox{position:relative;width:112px;display:grid;justify-items:center;gap:5px}
.orbbox.hp{grid-area:hp} .orbbox.mp{grid-area:mp}
.orb{width:112px;height:112px;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.orbtxt{position:absolute;top:46px;left:0;right:0;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 2px #000,0 0 8px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.plate{position:relative;font-family:var(--display);font-size:11px;letter-spacing:.16em;color:#2b1c0b;background:linear-gradient(180deg,#ecca82,#9c6f2f);
  border:1.5px solid #2b1c0b;border-radius:2px;padding:1px 12px 0;box-shadow:2px 2px 0 #000}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:3px;height:3px;border-radius:50%;background:#2b1c0b;transform:translateY(-50%)}
.plate::before{left:4px} .plate::after{right:4px}
.hmid{grid-area:mid;display:grid;justify-items:center;gap:6px;min-width:0}
.hmid .hand{padding:14px 10px 6px}
.hinfo{display:flex;align-items:center;gap:14px;width:100%;max-width:560px}
.hinfo .xp{flex:1;min-width:0}
.hright{grid-area:right;display:grid;gap:10px;justify-items:center;padding-bottom:26px}
.mskill{appearance:none;font:inherit;position:relative;width:66px;height:66px;padding:0;cursor:pointer;overflow:hidden;
  background:radial-gradient(circle at 50% 42%, color-mix(in srgb,var(--c) 55%, #000) 0, #1a110c 70%);border:2px solid #b8873c;border-radius:4px;box-shadow:3px 3px 0 #000, inset 0 0 0 2px #2b1c0b}
.mskill b{position:absolute;inset:0 0 18px;display:grid;place-items:center;font-family:var(--ko);font-weight:400;font-size:26px;color:var(--paper);text-shadow:2px 2px 0 #000, 0 0 10px var(--c)}
.mskill .mname{position:absolute;left:0;right:0;bottom:3px;font-family:var(--ko);font-size:9.5px;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.mskill .mcost{position:absolute;right:3px;top:2px;font-family:var(--mono);font-size:10px;font-weight:700;color:#9cc4ff;text-shadow:0 1px 2px #000}
.mskill .mcd{position:absolute;inset:0;background:rgba(0,0,0,.55);transform-origin:bottom;transform:scaleY(0);pointer-events:none}
.mskill.dry b{opacity:.45}
.mskill.dry .mcost{color:#ff7a5c}
.mskill:hover{border-color:var(--amber)}
.mskill:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mskill[aria-expanded="true"]{border-color:var(--amber);box-shadow:3px 3px 0 #000, inset 0 0 0 2px #2b1c0b, 0 0 16px rgba(232,163,61,.5)}
.skillpop{position:fixed;right:max(16px, env(safe-area-inset-right,0px));width:min(620px, calc(100vw - 32px));max-height:min(60vh, 520px);overflow:auto;z-index:9;
  background:#20160f;border:2px solid #b8873c;outline:1px dashed rgba(232,163,61,.45);outline-offset:-7px;border-radius:4px;padding:14px 16px 16px;box-shadow:6px 6px 0 #000;display:grid;gap:10px}
.skillpop[hidden]{display:none}
.pophead{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;color:var(--ash)}
.pophead .pbtn.ghost{color:var(--ash)}
.skillpop .tabs{flex-wrap:wrap}
.skillpop .row{flex-wrap:wrap;gap:6px}
.skillpop .spell{width:104px}
.spell .mp{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:10px;color:#7fb2ff}
@media (max-width:720px){
  .hud{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"mid mid mid" "hp right mp";gap:2px 10px}
  .orbbox,.orb{width:78px} .orb{height:78px}
  .orbtxt{top:30px;font-size:12px}
  .plate{font-size:9px;padding:0 9px}
  .hmid .hand{justify-content:center;padding-top:10px}
  .hright{display:flex;justify-content:center;align-items:center;gap:10px;padding-bottom:20px}
  .mskill{width:54px;height:54px} .mskill b{font-size:20px;inset:0 0 15px}
  .skillpop .spell{width:92px}
  .top p{display:none}
  .hist{top:calc(env(safe-area-inset-top,0px) + 92px)}
}

/* ===== slot cylinder ===== */
.cylwrap{padding:6px 0 4px;display:grid;place-items:center}
.cyl{--rot:0deg;position:relative;width:172px;height:172px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 36% 30%, #f3d48c 0, #c08f43 30%, #7a5221 66%, #2e1e0b 100%);
  box-shadow:0 10px 16px rgba(0,0,0,.75), inset 0 0 0 3px #2b1c0b, inset 0 0 22px rgba(0,0,0,.55);
  transform:rotate(var(--rot));transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.cyl::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 30deg, rgba(20,12,4,.55) 0 7deg, transparent 7deg 60deg);
  -webkit-mask:radial-gradient(circle, transparent 0 80%, #000 81%);mask:radial-gradient(circle, transparent 0 80%, #000 81%)}
.hub{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 32%, #e8c37a, #7a5221 60%, #2b1c0b);box-shadow:0 0 0 2px #2b1c0b, inset 0 0 0 5px rgba(0,0,0,.35)}
.ch{appearance:none;font:inherit;border:0;padding:0;cursor:pointer;position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;
  transform:rotate(var(--a)) translateY(-54px) rotate(calc(-1*var(--a)));
  background:radial-gradient(circle, #080503 0 60%, #3b2810 62% 70%, #140c05 72%);box-shadow:inset 0 3px 6px rgba(0,0,0,.9)}
.chi{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(calc(-1*var(--rot)));transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.ch.full{background:radial-gradient(circle, var(--c) 0 30%, color-mix(in srgb,var(--c) 40%,#000) 31% 36%, #1a1006 37% 41%, #e3bd70 42% 58%, #8a6026 60% 70%, #140c05 72%);
  box-shadow:0 0 0 2px var(--rc), inset 0 2px 3px rgba(255,240,200,.35)}
.ch.full b{font-family:var(--ko);font-weight:400;font-size:15px;color:#fff;text-shadow:1px 1px 0 #000, 0 0 6px #000;margin-top:-1px}
.ch em{position:absolute;bottom:-3px;right:-4px;font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--paper);background:var(--rust);border:1px solid var(--ink);padding:0 2px;line-height:1.2}
.ch.empty .chi{color:rgba(232,163,61,.75);font-family:var(--mono);font-size:16px;font-weight:700}
.ch.locked{cursor:default}
.ch.locked .chi{font-family:var(--mono);font-size:9px;font-weight:700;color:rgba(232,163,61,.55)}
.ch:not(.locked):hover{filter:brightness(1.25)}
.ch:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ch.fire{animation:chfire .35s ease-out}
@keyframes chfire{0%{box-shadow:0 0 0 2px var(--rc), 0 0 18px 6px var(--c)}100%{box-shadow:0 0 0 2px var(--rc), 0 0 0 0 transparent}}
@media (max-width:720px){
  .cyl{width:140px;height:140px}
  .ch{width:40px;height:40px;margin:-20px;transform:rotate(var(--a)) translateY(-43px) rotate(calc(-1*var(--a)))}
  .ch.full b{font-size:13px}
  .hub{width:24px;height:24px;margin:-12px}
  .hud{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"hp mid mp" "right right right"}
  .hinfo{flex-direction:column;align-items:stretch;gap:3px}
  .mats{flex-wrap:wrap;justify-content:center;gap:2px 8px;font-size:10px}
  .hright{padding-bottom:16px}
}
@media (prefers-reduced-motion: reduce){ .cyl,.chi{transition:none} .ch.fire{animation:none} }

/* ===== Poster skin: flat black, bold red & blue blocks, condensed type. Overrides everything above. ===== */
:root{ --red:#d8392b; --blue:#2f66d8; --off:#f1ece0; --blk:#0a0a0c; --amber:#e8a33d; --cond:'Bebas Neue', 'Oswald', 'Arial Narrow', sans-serif; }
@media (pointer:fine){ #c{filter:contrast(1.05) saturate(1.02)} }
.grain{opacity:.05}
.vignette{background:radial-gradient(ellipse at 50% 42%, transparent 60%, rgba(0,0,0,.5) 100%)}
.bar{background:var(--blk);border-top:3px solid var(--red);padding:0 0 calc(env(safe-area-inset-bottom,0px) + 10px)}
.strip-top{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto;padding:6px max(16px, env(safe-area-inset-right,0px)) 6px max(16px, env(safe-area-inset-left,0px));
  font-family:var(--mono);font-size:11px;color:#8a8a90;font-variant-numeric:tabular-nums}
.strip-top .lv{font-family:var(--cond);font-size:20px;line-height:1;color:var(--off);letter-spacing:.06em}
.strip-top .xpbar{flex:1 1 200px;min-width:60px;height:4px;border:0;border-radius:0;background:#26262c}
.strip-top .xpbar i{background:var(--off)}
.strip-top .mats{gap:14px;font-size:11px;color:#8a8a90}
.strip-top .mats b{color:var(--off);font-weight:700}
.strip-top .mats b.m2{color:#7fb0ff} .strip-top .mats b.m3{color:#ff8a6a}
.hud{display:flex;align-items:stretch;gap:0;grid-template-columns:none;grid-template-areas:none;max-width:1180px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.hud > *{border-left:2px solid #1d1d22}
.hud > *:first-child{border-left:0}
.gauge{--gc:var(--red);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:end;column-gap:10px;padding:8px 16px 10px;min-width:190px;background:var(--blk)}
.gauge.mp{--gc:var(--blue)}
.glabel{grid-column:1 / -1;font-family:var(--cond);font-size:15px;letter-spacing:.3em;color:var(--gc);line-height:1}
.gnum{font-family:var(--cond);font-size:44px;line-height:.85;color:var(--off);font-variant-numeric:tabular-nums;min-width:2.3ch}
.gbar{height:14px;margin-bottom:4px;background:repeating-linear-gradient(90deg, #222228 0 9px, transparent 9px 12px)}
.gbar i{display:block;height:100%;transform-origin:left;background:repeating-linear-gradient(90deg, var(--gc) 0 9px, transparent 9px 12px);transition:transform .2s}
.gauge.low .gnum{color:var(--gc)}
.gauge.hit{animation:ghit .35s ease-out}
@keyframes ghit{0%{background:var(--gc)}100%{background:var(--blk)}}
.slabs{flex:1;display:flex;justify-content:center;align-items:stretch;gap:6px;padding:8px 14px 10px;min-width:0}
.slab{appearance:none;font:inherit;border:0;padding:0;cursor:pointer;position:relative;width:52px;min-height:66px;flex:none;background:#151519;color:var(--off);overflow:hidden}
.slab .sn{position:absolute;left:4px;top:3px;font-family:var(--mono);font-size:9px;font-weight:700;color:#6b6b74;z-index:1}
.slab .sg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--ko);font-size:22px;padding-top:6px}
.slab.full{background:var(--c)}
.slab.full .sn{color:rgba(0,0,0,.55)}
.slab.full .sg{color:var(--blk)}
.slab .sr{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--rc);box-shadow:0 -2px 0 var(--blk)}
.slab em{position:absolute;right:4px;top:2px;font-style:normal;font-family:var(--cond);font-size:15px;color:var(--blk);z-index:1}
.slab.empty{background:transparent;outline:2px dashed #3a3a42;outline-offset:-2px}
.slab.empty .sg{color:#6b6b74;font-family:var(--cond);font-size:26px}
.slab.locked{cursor:default;background:repeating-linear-gradient(-45deg, #141418 0 6px, #0c0c0f 6px 12px)}
.slab.locked .sl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--cond);font-size:15px;letter-spacing:.06em;color:#4c4c55;padding-top:8px}
.slab:not(.locked):hover{filter:brightness(1.15);transform:translateY(-2px)}
.slab:focus-visible{outline:2px solid var(--off);outline-offset:2px}
.slab.fire{animation:sfire .3s ease-out}
@keyframes sfire{0%{filter:brightness(2) contrast(1.2)}100%{filter:none}}
.mskill{appearance:none;font:inherit;position:relative;width:auto;min-width:150px;height:auto;padding:8px 16px 10px;border:0;border-radius:0;box-shadow:none;cursor:pointer;
  background:var(--blk);display:grid;align-content:end;justify-items:start;gap:2px;text-align:left;overflow:hidden;outline-offset:-3px}
.mskill .tl{font-family:var(--cond);font-size:13px;letter-spacing:.28em;color:var(--c);line-height:1}

const ASSET_IMG = {};
for (const k in ASSET_SRC){
  const load = src => { const im = new Image(); im.onload = () => { sprCache.clear(); }; im.src = src; return im; };
  ASSET_IMG[k] = Array.isArray(ASSET_SRC[k]) ? ASSET_SRC[k].map(load) : load(ASSET_SRC[k]);
}
// which render each enemy type wears, its tint (null = keep the original colour), and whether it may spin
const ASSET_MAP = {
  normal:{ k:'normal', tint:null, rot:true, s:2.35 },
  runner:{ k:'runner', tint:null, rot:true, s:2.6 },
  brute: { k:'brute',  tint:null, rot:true, s:2.3 },
  meteor:{ k:'meteor', tint:null, rot:true, s:2.4 },
  elite: { k:'elite',  tint:null, rot:true, s:2.35 },
  boss:  { k:'boss',   tint:null, rot:true, s:2.25 },
};
function assetSprite(type, variant){
  const m = ASSET_MAP[type], img = ASSET_IMG[m.k] && ASSET_IMG[m.k][variant % 3];
  if (!img || !img.complete || !img.naturalWidth) return null;
  const R = ETYPE[type].r*VSIZE[variant], w = R*m.s, h = w*img.naturalHeight/img.naturalWidth, k = SPR_RES;
  const c = document.createElement('canvas'); c.width = Math.ceil(w*k); c.height = Math.ceil(h*k);
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
  if (m.tint){
    // keep the render's shading, swap its hue: desaturate, multiply by the tint, restore the alpha
    g.globalCompositeOperation = 'saturation'; g.fillStyle = '#808080'; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = `rgb(${m.tint.map(v => Math.min(255, v*1.25)|0)})`; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(img, 0, 0, c.width, c.height);
  }
  return { c, w, h, ox:w/2, oy:h/2, masks:new Map(), norot:!m.rot };
}
function demonSprite(type, dir, variant){
  const key = GFX + type + variant; let sp = sprCache.get(key); if (sp) return sp;
  if (GFX === 'asset' && ASSET_MAP[type]){ sp = assetSprite(type, variant); if (sp){ sprCache.set(key, sp); return sp; } }
  const T = ETYPE[type], R = T.r*VSIZE[variant], k = SPR_RES, w = Math.ceil((R*2 + 14)*k);
  const c = document.createElement('canvas'); c.width = c.height = w;
  const g = c.getContext('2d'), keep = ctx; ctx = g;
  g.translate(w/2, w/2); g.scale(k, k);
  if (CUSTOM_PAINT[type]) CUSTOM_PAINT[type](g, R, 11 + variant*97); else paintDemon(T, type, variant, R);
  ctx = keep;
  sp = { c, w:w/k, h:w/k, ox:w/2/k, oy:w/2/k, masks:new Map() };
  sprCache.set(key, sp); return sp;
}
function spriteMask(sp, col){
  const key = col.join(); let m = sp.masks.get(key); if (m) return m;
  m = document.createElement('canvas'); m.width = sp.c.width; m.height = sp.c.height;
  const g = m.getContext('2d'); g.drawImage(sp.c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = `rgb(${col})`; g.fillRect(0, 0, m.width, m.height);
  sp.masks.set(key, m); return m;
}
function drawEnemy(e){
  const T = e.T, p = demonPose(e); if (p.a <= 0) return;
  const sp = demonSprite(e.type, p.dir, e.variant);
  ctx.save();
  const st = Math.min(1, e.spawnT/.45), grow = e.dead ? 1 : 1 + 2.7*(st - 1)**3 + 1.7*(st - 1)**2;
  const sh = (1 - p.fall*.7)*grow; ctx.translate(e.x, e.y - e.r + p.bob*.5); ctx.scale(p.sx*sh, p.sy*sh); if (!sp.norot) ctx.rotate(e.rot || 0);
  ctx.globalAlpha = p.a; ctx.drawImage(sp.c, -sp.ox, -sp.oy, sp.w, sp.h);
  const over = (col, al) => { ctx.globalAlpha = p.a*al; ctx.drawImage(spriteMask(sp, col), -sp.ox, -sp.oy, sp.w, sp.h); };
  if (e.chill > 0) over([120,175,240], .45);
  if (e.tintT > 0 && e.tint && e.tint !== 'ice') over(ECOL[e.tint], e.tintT/.45*.45);
  if (e.heat > .03) over([255,128,48], Math.min(.6, e.heat*.6));
  if (e.flash > 0) over([255,255,255], e.flash/.12*.8);
  ctx.restore();

  if (!e.dead && e.hp < e.max){
    const bw = e.r*2 + 10, bx = e.x - bw/2, by = e.y - e.h - 7;
    ctx.globalAlpha = p.a*.92; ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    ctx.fillStyle = `rgb(${T.bar})`; ctx.fillRect(bx, by, bw*Math.max(0, e.hp/e.max), 4);
    if (e.amp > 0){ ctx.strokeStyle = `rgb(${PAL.blood[1]})`; ctx.lineWidth = 1; ctx.strokeRect(bx - 1.5, by - 1.5, bw + 3, 7); }
  }
}
// elite/boss ground ring, drawn under the stone so it never washes over it
function drawEnemyBase(e){
  if (e.dead || !e.T.ring) return;
  const a = Math.min(1, e.spawnT/.4);
  ctx.globalAlpha = (.5 + .15*Math.sin(time*3 + e.seed))*a; ctx.strokeStyle = `rgb(${e.T.ring})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(e.x, e.y - e.r, e.r + 5, 0, TAU); ctx.stroke();
  sprite(e.x, e.y - e.r, e.r*2.1, e.T.ring, .22*a);
}
function drawEnemyFx(e){
  if (e.dead) return;
  drawTail(e);
  const a = demonPose(e).a;
  if (e.heat > .03){
    // bow shock: a hot glow on the leading face
    const sp = Math.hypot(e.vx, e.vy) || 1, cx = e.x + e.vx/sp*e.r*.55, cy = e.y - e.r + e.vy/sp*e.r*.55;
    sprite(cx, cy, e.r*(1.3 + e.heat), PAL.fire[2], .55*e.heat);
    sprite(cx, cy, e.r*.7, PAL.fire[0], .5*e.heat);
    light(cx, cy, e.r*5, LIGHT.fire, .5*e.heat);
  }
  if (e.dead) return;
  if (e.amp > 0) sprite(e.x, e.y - e.h - 4, 14, PAL.blood[2], .5);
  if (e.stun > 0) for (let k = 0; k < 3; k++){ const o = time*5 + k*TAU/3; sprite(e.x + Math.cos(o)*e.r, e.y - e.h - 8 + Math.sin(o)*4, 3.5, PAL.shout[1], .9); }
}
function drawFloats(){
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const f of floats){
    const t = f.age/.9, y = f.y - 34*t;
    ctx.globalAlpha = t < .7 ? 1 : 1 - (t - .7)/.3;
    ctx.font = `600 ${((f.big ? 15 : 12)/Math.sqrt(ZOOM)).toFixed(1)}px 'IBM Plex Sans KR', system-ui, sans-serif`;
    if (!MOBILE){ ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 3; ctx.strokeText(f.v, f.x, y); }
    ctx.fillStyle = `rgb(${mix(f.c, [255,255,255], .35)})`; ctx.fillText(f.v, f.x, y);
  }
}

function makeCore(kind, rar = 0, ilvl = 1){ return { id:itemId++, base:'core', kind, rar, ilvl, plus:0, afx:[], name:CORE[kind].name }; }
function rollItem(ilvl, minRar = 0){

  const n = [0, 1 + (Math.random() < .5 ? 1 : 0), 3 + (Math.random() < .4 ? 1 : 0), 5][rar];
  const pool = AFX.filter(a => (isCore || !a.core) && (!a.rare || rar >= 2));

    const a = pool.splice((Math.random()*pool.length)|0, 1)[0];

function updCores(dt){

const DROP = {
  normal:{ shard:.45 }, runner:{ shard:.35 }, brute:{ shard:1, metal:.25 },
  meteor:{ shard:1, metal:.3 }, elite:{ shard:1, metal:1, item:.5, minRar:1 }, boss:{ shard:1, metal:1, core:1, item:1, minRar:2 },
  comet:{ shard:1, metal:.5, core:.1 }, splitter:{ shard:.8 }, shard:{ shard:.15 }, pebble:{ shard:.15 }, planet:{ shard:1, metal:1, core:1, item:1, minRar:3 },

const pickups = [];

function dropLoot(e){
  const d = DROP[e.type]; if (!d) return;
  const cx = e.x, cy = e.y - e.r, boost = 1 + (S.mat || 0)/100;
  const put = (kind, n, item) => { const a = rand(0, TAU), sp = rand(60, 160); pickups.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, kind, n, item, age:0, src:e.type }); };
  for (const k of ['shard', 'metal', 'core']){
    if (d[k] && Math.random() < d[k]){ const n = Math.max(1, Math.round((k === 'shard' ? rint(1, 2) : 1)*boost*rand(.8, 1.2))); put(k, n); }
  }
  if (d.item && Math.random() < d.item) put('item', 1, rollItem(Math.max(1, level + rint(-1, 1)), d.minRar || 0));
}
function updPickups(dt){
  const hx = origin.x, hy = origin.y - 8;
  for (let i = pickups.length - 1; i >= 0; i--){
    const p = pickups[i]; p.age += dt;
    if (p.age < .45){ const f = Math.exp(-4*dt); p.vx *= f; p.vy *= f; }
    else { const dx = hx - p.x, dy = hy - p.y, d = Math.hypot(dx, dy) || 1, acc = 900 + p.age*900; p.vx += dx/d*acc*dt; p.vy += dy/d*acc*dt; const f = Math.exp(-2*dt); p.vx *= f; p.vy *= f; if (d < 16){ collect(p); pickups.splice(i, 1); continue; } }
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}
function collect(p){
  if (p.kind !== 'item'){ mats[p.kind] += p.n; slotsDirty = true; return; }
  const it = p.item;
  stash.unshift(it); bagNew++;
  logEvent(`${RAR[it.rar].n} ${it.name}`, `${p.src === 'boss' ? '보스' : '엘리트'} 처치 · 가방에 추가`, RAR[it.rar].c);
  flash(origin.x, origin.y - 8, 120, RAR[it.rar].c, .8, .25);
  slotsDirty = true;
}

    const c = p.kind === 'item' ? RAR[p.item.rar].c : MAT_COL[p.kind], s = p.kind === 'item' ? 7 : p.kind === 'shard' ? 3.5 : 5;

/* ---------- generic projectile (arrows, javelins, bolts) ---------- */
class Proj {
  constructor(o){
    Object.assign(this, { speed:900, len:18, home:0, pal:PAL.bow, kind:'arrow', trail:null, onHit:null, collide:false, dmg:0, elem:'bow', pierce:false, targetE:null }, o);
    const dx = this.tx - this.x, dy = this.ty - this.y;
    this.max = o.max ?? Math.max(30, Math.hypot(dx, dy));
    this.ang = o.ang ?? Math.atan2(dy, dx);
    this.trav = 0; this.age = 0;
  }
  update(dt){
    this.age += dt;
    if (this.home){
      let diff = Math.atan2(this.ty - this.y, this.tx - this.x) - this.ang;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      this.ang += Math.max(-this.home*dt, Math.min(this.home*dt, diff));
      this.home += dt*6;
    }
    if (this.targetE){ if (!alive(this.targetE)) this.targetE = null; else { const c = ectr(this.targetE); this.tx = c.x; this.ty = c.y; } }
    const st = this.speed*dt;
    this.x += Math.cos(this.ang)*st; this.y += Math.sin(this.ang)*st; this.trav += st;
    if (this.trail) this.trail(this, dt, st);
    if (this.collide){
      const e = enemyAt(this.x, this.y);
      if (e){
        if (!this.pierce && this.pierceN > 0 && !(this.hitSet && this.hitSet.has(e))){
          if (!this.hitSet) this.hitSet = new Set();
          this.hitSet.add(e); this.pierceN--; hurt(e, this.dmg, this.elem, { x:this.x - Math.cos(this.ang)*20, y:this.y - Math.sin(this.ang)*20 });
          sparks(this.x, this.y, this.pal, 4, 180, 1.6);
        } else if (this.hitSet && this.hitSet.has(e) && !this.pierce){
          // already passed through this one
        } else if (this.pierce){
          if (!this.hitSet) this.hitSet = new Set();
          if (!this.hitSet.has(e)){ this.hitSet.add(e); hurt(e, this.dmg, this.elem, { x:this.x - Math.cos(this.ang)*20, y:this.y - Math.sin(this.ang)*20 }); this.onPierce && this.onPierce(this.x, this.y, e); }
        } else { hurt(e, this.dmg, this.elem, { x:this.x - Math.cos(this.ang)*20, y:this.y - Math.sin(this.ang)*20 }); this.onHit && this.onHit(this.x, this.y, this, e); return false; }
      }
    }
    const done = this.home ? (Math.hypot(this.tx - this.x, this.ty - this.y) < st + 6 || this.age > 3) : this.trav >= this.max;
    if (done){ this.onHit && this.onHit(this.x, this.y, this); return false; }
    return true;
  }
  draw(){
    const a = this.ang, p = this.pal;
    if (this.kind === 'orb'){ const z = this.small ? .55 : 1; sprite(this.x, this.y, 20*z, p[2], .85); sprite(this.x, this.y, 8*z, p[0], 1); return; }
    if (this.kind === 'holy'){
      sprite(this.x, this.y, 22, p[2], .8); sprite(this.x, this.y, 8, p[0], 1);
      const r = time*9; streak(this.x, this.y, r, 13, 4, p[1], .95); streak(this.x, this.y, r + Math.PI/2, 13, 4, p[1], .95);
      return;
    }
    if (this.kind === 'spear'){
      const cs = Math.cos(a), sn = Math.sin(a);
      streak(this.x - cs*60, this.y - sn*60, a, 40, 5, p[3], .3);
      streak(this.x - cs*24, this.y - sn*24, a, 28, 8, p[2], .6);
      streak(this.x - cs*22, this.y - sn*22, a, 24, 3, p[0], 1);
      streak(this.x, this.y, a, 9, 6, p[1], 1);
      sprite(this.x, this.y, 12, p[2], .7);
      return;
    }
    if (this.kind === 'spirit'){
      sprite(this.x, this.y, 26, p[3], .6); sprite(this.x, this.y, 12, p[2], .9); sprite(this.x, this.y, 5, p[0], 1);
      for (let k = 0; k < 3; k++){ const o = time*10 + k*TAU/3; sprite(this.x + Math.cos(o)*9, this.y + Math.sin(o)*9, 5, p[1], .8); }
      return;
    }

      ctx.stroke();
      ctx.beginPath();
      for (let t = 0; t < 2; t++) for (let i = 0; i <= 3; i++){ const a = -this.rot*1.3 + t*Math.PI/3 + i/3*TAU, x = Math.cos(a)*R*.76, y = Math.sin(a)*R*.76; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

    }
    ctx.restore();
    sprite(this.x, this.y, R*.9, p[3], .14*k*breathe);
  }
}

function line(x1, y1, x2, y2, passes, a){
  ctx.lineCap = 'round';
  for (const [lw, c, al] of passes){ ctx.globalAlpha = a*al; ctx.strokeStyle = `rgb(${c})`; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
}
const STEEL_PASS = () => [[7, PAL.steel[3], .25], [3, PAL.steel[1], .7], [1.2, PAL.steel[0], 1]];

class Whirlwind {
  constructor(ox, oy, tx, ty){
    this.sx = ox; this.sy = oy - 10; this.tx = tx; this.ty = ty;
    this.move = Math.max(.7, Math.hypot(tx - this.sx, ty - this.sy)/340);
    this.life = this.move + .35; this.age = 0; this.spin = rand(0, TAU); this.x = this.sx; this.y = this.sy;
  }
  k(){ return Math.max(0, Math.min(1, this.age/.12, (this.life - this.age)/.3)); }
  pt(a, r){ return { x:this.x + Math.cos(a)*r, y:this.y - 22 + Math.sin(a)*r*ELL }; }
  sword(a, k){
    // blade lies radially in the spin plane: grip, crossguard, tapered blade with a bright fuller
    let tx = -Math.sin(a), ty = Math.cos(a)*ELL; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const P = (r, w) => { const c = this.pt(a, r); return [c.x + tx*w, c.y + ty*w]; };
    const blade = [P(17, -3.6), P(52, -2.6), P(62, 0), P(52, 2.6), P(17, 3.6)];
    const guard = [P(14, -9), P(17, -9), P(17, 9), P(14, 9)];
    const grip = [P(4, -1.8), P(14, -1.8), P(14, 1.8), P(4, 1.8)];
    const poly = pts => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); };
    ctx.lineJoin = 'round';
    ctx.globalAlpha = .3*k; ctx.strokeStyle = `rgb(${PAL.steel[3]})`; ctx.lineWidth = 7;
    poly(blade); ctx.stroke(); poly(guard); ctx.stroke();
    ctx.globalAlpha = .9*k; ctx.fillStyle = `rgb(${PAL.steel[2]})`; poly(blade); ctx.fill();
    ctx.fillStyle = `rgb(${PAL.steel[3]})`; poly(grip); ctx.fill();
    ctx.fillStyle = `rgb(${PAL.steel[1]})`; poly(guard); ctx.fill();
    const f0 = P(18, 0), f1 = P(55, 0);
    ctx.globalAlpha = k; ctx.strokeStyle = `rgb(${PAL.steel[0]})`; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(f0[0], f0[1]); ctx.lineTo(f1[0], f1[1]); ctx.stroke();
    const tip = P(60, 0); sprite(tip[0], tip[1], 5, PAL.steel[0], .8*k);
  }
  update(dt){
    this.age += dt; const p = Math.min(1, this.age/this.move), k = this.k();
    this.x = lerp(this.sx, this.tx, p); this.y = lerp(this.sy, this.ty, p);
    this.spin += dt*24*(.4 + .6*k);
    const n = Math.ceil(dt*55*k);
    for (let i = 0; i < n; i++){
      const a = rand(0, TAU), r = rand(20, 58), s = rand(60, 150);
      emit({ x:this.x + Math.cos(a)*r, y:this.y + Math.sin(a)*r*ELL, vx:-Math.sin(a)*s, vy:Math.cos(a)*s*ELL - rand(10,30), drag:2, life:rand(.5,.9), s0:rand(10,18), s1:26, a:.09, pal:PAL.earth });
    }
    if (Math.random() < dt*16*k){
      const a = this.spin + (Math.random() < .5 ? 0 : Math.PI), tip = this.pt(a, 54), s = rand(200, 380);
      emit({ x:tip.x, y:tip.y, vx:-Math.sin(a)*s, vy:Math.cos(a)*s*ELL - rand(40,120), ay:700, drag:1, life:rand(.25,.45), s0:2, s1:.6, streak:3, pal:PAL.steel });
    }
    if (!this.cd) this.cd = new Map();
    for (const e of enemies){
      if (!alive(e) || Math.hypot(e.x - this.x, (e.y - this.y)/ELL) > 62 + e.r) continue;
      const c = this.cd.get(e) || 0;
      if (time >= c){ this.cd.set(e, time + .18); hurt(e, DMG.whirlwind, 'steel'); const q = ectr(e); sparks(q.x, q.y, PAL.steel, 5, 260, 2); }
    }
    light(this.x, this.y - 20, 170, LIGHT.steel, .5*k);
    return this.age < this.life;
  }
  draw(){
    const k = this.k(); if (!k) return;
    sprite(this.x, this.y - 18, 64, PAL.steel[3], .12*k);
    for (const b of [0, Math.PI]){
      const a0 = this.spin + b;
      for (let j = 1; j <= 16; j++){
        const a = a0 - j*.1, i0 = this.pt(a, 14), i1 = this.pt(a, 54);
        ctx.globalAlpha = .3*k*(1 - j/16)**2; ctx.strokeStyle = `rgb(${PAL.steel[2]})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(i0.x, i0.y); ctx.lineTo(i1.x, i1.y); ctx.stroke();
      }
      for (let j = 0; j < 12; j++){
        const a = a0 - j*.12, q = this.pt(a, 55);
        streak(q.x, q.y, Math.atan2(Math.cos(a)*ELL, -Math.sin(a)), 8, 3.5, PAL.steel[1], .55*k*(1 - j/12));
      }
      this.sword(a0, k);
    }
  }
}

class Berserk {
  constructor(x, y){ this.x = x; this.y = y; this.age = 0; this.life = .75; this.burst = false; }
  crescent(cx, cy, r, a0, a1, p, alpha){
    const head = lerp(a0, a1, p), tail = lerp(a0, a1, Math.max(0, p - .75)), N = 18, pts = [];
    for (let i = 0; i <= N; i++){ const a = lerp(tail, head, i/N); pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]); }
    ctx.lineCap = 'round';
    for (const [m, c, al] of [[3.2, PAL.rage[3], .25], [1.6, PAL.rage[2], .65], [.55, PAL.rage[0], 1]]){
      ctx.strokeStyle = `rgb(${c})`;
      for (let i = 0; i < N; i++){
        const t = i/N; ctx.globalAlpha = alpha*al*(.3 + .7*t);
        ctx.lineWidth = (Math.sin(Math.PI*t)*6 + .6)*m;
        ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i+1][0], pts[i+1][1]); ctx.stroke();
      }
    }
  }
  update(dt){
    this.age += dt;
    if (this.age > .17 && !this.burst){
      this.burst = true; const x = this.x, y = this.y;
      for (let i = 0; i < 40; i++){ const a = rand(0, TAU), s = rand(80, 340); emit({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, drag:3, life:rand(.3,.6), s0:rand(5,10), s1:1, pal:PAL.rage }); }
      sparks(x, y, PAL.rage, 16, 460);
      ring(x, y, 4, 90, .4, PAL.rage[1], 4); flash(x, y, 240, LIGHT.rage, 1.4, .35); addShake(4); hurtArea(x, y, 50, DMG.berserk, 'rage');
    }
    light(this.x, this.y, 160, LIGHT.rage, .6*(1 - this.age/this.life));
    return this.age < this.life;
  }
  draw(){
    const fade = a => a < .3 ? 1 : Math.max(0, 1 - (a - .3)/.4);
    const q = Math.PI*3/4, x = this.x, y = this.y;
    this.crescent(x + 38, y - 38, 54, q - .95, q + .95, Math.min(1, this.age/.1), fade(this.age));
    const t2 = this.age - .08;
    if (t2 > 0) this.crescent(x - 38, y - 38, 54, Math.PI/4 + .95, Math.PI/4 - .95, Math.min(1, t2/.1), fade(t2));
  }
}

class BattleOrders {

class Harpoon {

      const e = enemyAt(this.x, this.y, 4);

class Orbital {

      for (let i = 0; i < 4; i++) emit({ x:this.x + rand(-w, w)*.6, y:this.y + rand(-6, 6), vx:rand(-160,160), vy:rand(-160,-20), drag:2, life:rand(.2,.45), s0:3, s1:1, streak:2.5, pal:PAL.gun });

      for (let i = 0; i < 4; i++){ const a = rot + i*Math.PI/2; ctx.moveTo(x + Math.cos(a)*(r - 8), y + Math.sin(a)*(r - 8)); ctx.lineTo(x + Math.cos(a)*(r + 10), y + Math.sin(a)*(r + 10)); }
      ctx.stroke();
      ctx.globalAlpha = .25*t; ctx.fillStyle = 'rgb(255,70,50)'; ctx.fillRect(x - 1, -10, 2, y + 10);

class LongShot {

// flat three-tone cel painter shared by the code-drawn rocks (light from the upper left, no outline)
function celRock(g, R, seed, base, rough = .22){
  const rnd = srng(seed), n = 13, pts = [];
  for (let i = 0; i < n; i++){ const a = i/n*TAU + rnd()*.25, rr = R*(1 - rough*rnd()); pts.push([Math.cos(a)*rr, Math.sin(a)*rr]); }
  const path = () => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
  path(); g.fillStyle = `rgb(${mix(base, [12,10,18], .55)})`; g.fill();
  g.save(); path(); g.clip();
  g.fillStyle = `rgb(${base})`; g.beginPath(); g.arc(-R*.22, -R*.24, R*.92, 0, TAU); g.fill();
  g.fillStyle = `rgb(${mix(base, [255,250,240], .28)})`; g.beginPath(); g.arc(-R*.42, -R*.46, R*.42, 0, TAU); g.fill();
  for (let i = 0; i < 3; i++){
    const cx = (rnd() - .5)*R*1.1, cy = (rnd() - .5)*R*1.1, cr = R*(.12 + rnd()*.12);
    g.fillStyle = `rgb(${mix(base, [12,10,18], .4)})`; g.beginPath(); g.ellipse(cx, cy, cr, cr*.8, 0, 0, TAU); g.fill();
    g.fillStyle = `rgb(${mix(base, [255,250,240], .18)})`; g.beginPath(); g.ellipse(cx + cr*.25, cy + cr*.25, cr*.55, cr*.4, 0, 0, TAU); g.fill();
  }
  g.restore();
  return path;
}
function glowCracks(g, R, seed, col, w){
  const rnd = srng(seed + 7);
  g.strokeStyle = `rgb(${col})`; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let k = 0; k < 3; k++){
    let x = (rnd() - .5)*R*.6, y = (rnd() - .5)*R*.6; g.beginPath(); g.moveTo(x, y);
    for (let j = 0; j < 4; j++){ x += (rnd() - .5)*R*.55; y += (rnd() - .5)*R*.55; g.lineTo(x, y); }
    g.stroke();
  }
}
function paintRogue(g, R, seed){
  // a dead world: banded crimson crust, magma seams, a hard cel terminator
  const base = [128,62,54];
  g.fillStyle = `rgb(${mix(base, [10,6,12], .6)})`; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
  g.save(); g.beginPath(); g.arc(0, 0, R, 0, TAU); g.clip();
  g.fillStyle = `rgb(${base})`; g.beginPath(); g.arc(-R*.3, -R*.28, R*.98, 0, TAU); g.fill();
  g.rotate(-.35);
  const rnd = srng(seed);
  for (let i = -4; i <= 4; i++){
    const y = i*R*.22 + (rnd() - .5)*R*.06, h = R*(.05 + rnd()*.07);
    g.fillStyle = i % 2 ? 'rgba(20,8,10,.28)' : 'rgba(255,190,150,.10)'; g.fillRect(-R, y, R*2, h);
  }
  g.rotate(.35);
  g.fillStyle = `rgb(${mix(base, [255,236,210], .3)})`; g.beginPath(); g.arc(-R*.5, -R*.52, R*.32, 0, TAU); g.fill();
  for (let i = 0; i < 6; i++){
    const cx = (rnd() - .5)*R*1.4, cy = (rnd() - .5)*R*1.4, cr = R*(.06 + rnd()*.1);
    g.fillStyle = 'rgba(20,8,12,.45)'; g.beginPath(); g.ellipse(cx, cy, cr, cr*.75, 0, 0, TAU); g.fill();
  }
  glowCracks(g, R*1.6, seed, [255,128,48], Math.max(1.5, R*.035));
  glowCracks(g, R*1.6, seed, [255,226,150], Math.max(.6, R*.012));
  g.restore();
}
var CUSTOM_PAINT = {
  comet:   (g, R, s) => { celRock(g, R, s, [236,104,74], .14); g.fillStyle = 'rgb(255,226,190)'; g.beginPath(); g.arc(-R*.2, -R*.2, R*.35, 0, TAU); g.fill(); },
  splitter:(g, R, s) => { celRock(g, R, s, [104,92,126], .2); glowCracks(g, R, s, [110,236,255], Math.max(1.2, R*.12)); glowCracks(g, R, s, [235,255,255], Math.max(.5, R*.04)); },
  shard:   (g, R, s) => { celRock(g, R, s, [116,104,140], .35); glowCracks(g, R*.7, s, [110,236,255], 1); },
  pebble:  (g, R, s) => { celRock(g, R, s, [150,128,108], .3); },
  planet:  (g, R, s) => paintRogue(g, R, s),
};

// comets cross the sky fast; about half are aimed at Earth, the rest are fly-bys you can still shoot down
function placeComet(e){
  e.flyby = Math.random() < .5;
  if (mapMode === 'orbit'){
    const a = rand(0, TAU), far = Math.hypot(W, H)*.5 + 120 + rand(0, 900);
    e.x = earth.cx + Math.cos(a)*far; e.y = earth.cy + Math.sin(a)*far + e.r;
    if (e.flyby){ const p = a + Math.PI/2, off = earth.R*rand(3, 5)*(Math.random() < .5 ? 1 : -1); e.aimX = earth.cx - Math.cos(a)*far + Math.cos(p)*off; e.aimY = earth.cy - Math.sin(a)*far + Math.sin(p)*off; }
    else { e.aimX = earth.cx; e.aimY = earth.cy; }
  } else {
    const left = Math.random() < .5;
    e.x = left ? -40 - rand(0, 900) : W + 40 + rand(0, 900); e.y = rand(-60, H*.3) + e.r;
    if (e.flyby){ e.aimX = left ? W + 600 : -600; e.aimY = e.y + rand(H*.25, H*.6); }
    else { e.aimX = earth.cx + rand(-1, 1)*W*.3; e.aimY = earth.top + 60; }
  }
  const dx = e.aimX - e.x, dy = e.aimY - e.y, d = Math.hypot(dx, dy) || 1;
  e.vx = dx/d*e.fallSp; e.vy = dy/d*e.fallSp; e.spin = rand(-2, 2);
  e.hx = e.wx = e.x; e.hy = e.wy = e.y;
}
function offscreen(e, m){
  if (mapMode === 'orbit') return Math.hypot(e.x - earth.cx, e.y - earth.cy) > Math.hypot(W, H)*.5 + m + 900;
  return e.x < -m || e.x > W + m || e.y > H + m;
}
// a temporary rock (fragments, shower pebbles, the rogue planet) leaves the pool when it dies
function spawnTemp(type, x, y, vx, vy){
  const e = makeEnemy(type);
  e.temp = true; e.x = e.hx = e.wx = x; e.y = e.hy = e.wy = y; e.vx = vx; e.vy = vy; e.spawnT = .3;
  if (mapMode === 'orbit'){ e.aimX = earth.cx + rand(-1, 1)*earth.R*.5; e.aimY = earth.cy + rand(-1, 1)*earth.R*.5; }
  else { e.aimX = x + vx*.6; e.aimY = earth.top + 60; }
  enemies.push(e); return e;
}
function splitRock(e){
  const c = ectr(e);
  for (let i = 0; i < 3; i++){
    const a = -Math.PI/2 + (i - 1)*.9 + rand(-.2, .2), sp = rand(120, 180);
    const s = spawnTemp('shard', c.x + Math.cos(a)*6, c.y + Math.sin(a)*6 + 6, Math.cos(a)*sp, Math.sin(a)*sp);
    if (mapMode === 'line') s.aimX = c.x + Math.cos(a)*220;
  }
  ring(c.x, c.y, 4, 46, .3, [110,236,255], 3);
}

var EV = { shower:35, planet:70, banner:null, bannerT:0 };
function resetEvents(){ EV.shower = simMax ? 8 : 35; EV.planet = simMax ? 4 : 70; EV.banner = null; EV.bannerT = 0; }
function banner(title, sub){ EV.banner = { title, sub }; EV.bannerT = 2.6; }
function meteorShower(){
  const n = simMax ? 28 : 14, left = Math.random() < .5;
  for (let i = 0; i < n; i++){
    let x, y, vx, vy;
    if (mapMode === 'orbit'){
      const a = rand(0, TAU)*.15 + (left ? 0 : Math.PI), far = Math.hypot(W, H)*.5 + 80 + i*22;
      x = earth.cx + Math.cos(a)*far; y = earth.cy + Math.sin(a)*far; const d = Math.hypot(earth.cx - x, earth.cy - y); vx = (earth.cx - x)/d*150; vy = (earth.cy - y)/d*150;
    } else { x = (left ? rand(-100, W*.4) : rand(W*.6, W + 100)) ; y = -30 - i*26 - rand(0, 30); vx = (left ? 1 : -1)*rand(50, 90); vy = rand(130, 170); }
    spawnTemp('pebble', x, y, vx, vy);
  }
  banner('METEOR SHOWER', `유성우 · ${n}개`);
  logEvent('유성우 접근', `작은 운석 ${n}개가 한꺼번에 쏟아짐`, [232,163,61]);
}
function rogueIncoming(){
  const e = makeEnemy('planet'); e.temp = true; e.variant = 1; e.r = ETYPE.planet.r; e.h = e.r*2; e.m = (e.r/11)**2;
  if (mapMode === 'orbit'){ const a = rand(0, TAU), far = Math.hypot(W, H)*.5 + e.r; e.x = earth.cx + Math.cos(a)*far; e.y = earth.cy + Math.sin(a)*far; e.aimX = earth.cx; e.aimY = earth.cy; }
  else { e.x = rand(W*.3, W*.7); e.y = e.r*.95; e.aimX = earth.cx + rand(-.15, .15)*W; e.aimY = earth.top + 60; }

function updEvents(dt){
  EV.bannerT = Math.max(0, EV.bannerT - dt);
  if (gameOver || paused) return;
  EV.shower -= dt; if (EV.shower <= 0){ EV.shower = simMax ? 12 : rand(38, 50); meteorShower(); }
  const planetUp = enemies.some(e => e.type === 'planet' && !e.dead);
  if (!planetUp){ EV.planet -= dt; if (EV.planet <= 0){ EV.planet = simMax ? 20 : rand(100, 130); rogueIncoming(); } }
}
function drawEvents(){
  ctx.globalCompositeOperation = 'source-over';
  // rogue planet health, poster bar across the top
  const pl = enemies.find(e => e.type === 'planet' && !e.dead);
  if (pl){
    const bw = Math.min(W*.5, 420), bx = W/2 - bw/2, by = 104;
    ctx.globalAlpha = .92; ctx.fillStyle = '#0a0a0c'; ctx.fillRect(bx - 4, by - 4, bw + 8, 16);
    ctx.fillStyle = '#3a1a16'; ctx.fillRect(bx, by, bw, 8);
    ctx.fillStyle = '#d8392b'; ctx.fillRect(bx, by, bw*Math.max(0, pl.hp/pl.max), 8);
    ctx.globalAlpha = 1; skewTag(bx - 6, by - 14, 'ROGUE PLANET', 16, '#d8392b', '#f1ece0');
    ctx.font = '11px "Courier Prime", ui-monospace, monospace'; ctx.fillStyle = '#f1ece0'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const txt = `${Math.ceil(pl.hp)} / ${pl.max}`; ctx.fillText(txt, bx + bw - ctx.measureText(txt).width, by - 12);
  }
  if (EV.bannerT > 0 && EV.banner){
    const t = 2.6 - EV.bannerT, k = Math.min(1, t*5)*Math.min(1, EV.bannerT*2.5), slide = (1 - Math.min(1, t*5))*-60;
    ctx.globalAlpha = k;

    ctx.globalAlpha = 1;

}
// tails: comets wear a long ion tail and a curved dust tail; shower pebbles leave short streaks
function drawTail(e){
  const c = ectr(e), sp = Math.hypot(e.vx, e.vy) || 1, dx = -e.vx/sp, dy = -e.vy/sp, px = -dy, py = dx, R = e.r;
  if (e.type === 'comet'){
    sprite(c.x, c.y, R*3.4, [255,110,70], .55); light(c.x, c.y, R*9, [255,110,60], .5);
    const n = MOBILE ? 8 : 14, L = R*18;
    for (let i = 1; i <= n; i++){
      const t = i/n;
      sprite(c.x + dx*L*t, c.y + dy*L*t, R*(2.4 - t*1.6), [255,72,44], .46*(1 - t));
      sprite(c.x + dx*L*t*.8 + px*t*t*R*5, c.y + dy*L*t*.8 + py*t*t*R*5, R*(2.8 - t*1.5), [255,186,110], .22*(1 - t));
    }
  } else if (e.type === 'pebble'){
    for (let i = 1; i <= 4; i++){ const t = i/4; sprite(c.x + dx*R*7*t, c.y + dy*R*7*t, R*(1.6 - t), [255,190,120], .35*(1 - t)); }
  } else if (e.type === 'planet'){
    sprite(c.x, c.y, R*2.6, [255,110,60], .12 + .04*Math.sin(time*2));
  }
}

  if (pickQ > 0 && !picking && !gameOver) openPick();
  if (simMax && earth.hp < earthMax()){ earth.hp = earthMax(); hpDirty = true; }
  updPickups(dt);
  if (!gameOver && S.regen && earth.hp < earthMax()){ earth.hp = Math.min(earthMax(), earth.hp + S.regen*dt); hpDirty = true; }
  earth.flash = Math.max(0, earth.flash - dt*2.5);
  for (let i = active.length - 1; i >= 0; i--) if (!active[i].update(dt)) active.splice(i, 1);
  if (!gameOver) updEnemies(dt);
  updParts(dt);
  for (let i = flashes.length - 1; i >= 0; i--){ const f = flashes[i]; f.age += dt; if (f.age >= f.life){ flashes.splice(i, 1); continue; } const t = f.age/f.life; light(f.x, f.y, f.r*(1 + .3*t), f.c, f.i*(1-t)*(1-t)); }
  for (let i = rings.length - 1; i >= 0; i--){ rings[i].age += dt; if (rings[i].age >= rings[i].life) rings.splice(i, 1); }
  shake *= Math.exp(-9*dt); if (shake < .05) shake = 0;
}
function render(){
  shX = shake ? rand(-1,1)*shake : 0; shY = shake ? rand(-1,1)*shake : 0;
  ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(RS, 0, 0, RS, RS*shX, RS*shY);
  ctx.globalCompositeOperation = 'lighter';
  if (lights.length > (MOBILE ? 6 : 40)){ lights.sort((p, q) => q.i - p.i); lights.length = MOBILE ? 6 : 40; }
  for (const L of lights){ ctx.globalAlpha = Math.min(.28, L.i*.14); const r = L.r*.6; ctx.drawImage(softSprite(L.c), L.x - r, L.y - r, r*2, r*2); }
  ctx.globalCompositeOperation = 'source-over';
  drawEarth();
  drawCities();
  drawHeroBody();
  for (const d of debris){
    const t = d.age/d.life, rr = d.r*(1 - t*.4);
    ctx.globalAlpha = 1 - t*t; ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.drawImage(d.sp.c, -rr*1.3, -rr*1.3, rr*2.6, rr*2.6); ctx.restore();
  }
  enemies.slice().sort((p, q) => p.y - q.y).forEach(drawEnemy);
  ctx.globalCompositeOperation = 'lighter';
  for (const e of enemies) drawEnemyFx(e);
  drawHero();
  drawParts();
  drawPickups();
  for (const r of rings){
    const t = r.age/r.life, rr = lerp(r.r0, r.r1, 1 - (1-t)**3);
    ctx.strokeStyle = `rgb(${r.c})`;
    ctx.globalAlpha = (1-t)*.25*r.a; ctx.lineWidth = r.w*3; ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr*ELL, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1-t)*.8*r.a; ctx.lineWidth = r.w*(1-t) + 1; ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr*ELL, 0, 0, TAU); ctx.stroke();
  }
  for (const s of active) s.draw && s.draw();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawRings();
  drawEvents();
  drawFloats(); ctx.globalAlpha = 1;
}

let last = performance.now(), fpsT = 0, fpsN = 0, slow = 0;
const ehpT = document.getElementById('ehpt');
const statsEl = document.getElementById('stats'), lvEl = document.getElementById('lv'), xpEl = document.getElementById('xpfill'), xptEl = document.getElementById('xpt');
let errShown = false;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.033, (now - last)/1000); last = now; time += dt;
  try { update(dt); render(); }
  catch (err){ if (!errShown){ errShown = true; console.error(err); } ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
  CLASSES[cls].skills.forEach((s, k) => { const b = btns[k]; if (!b) return; const v = Math.round(s.cdLeft/s.cd*40)/40; if (b._cd !== v){ b._cd = v; b.lastChild.style.transform = `scaleX(${v})`; } });
  if (slotsDirty) renderSlots();
  if (hpDirty){ hpDirty = false; ehpT.textContent = `${Math.floor(earth.hp)}`; }
  { const mv = Math.floor(mana); if (mpT._v !== mv){ mpT._v = mv; mpT.textContent = mv; } }
  drawOrbs(); renderMskill();
  if (xpDirty){ xpDirty = false; lvEl.textContent = `Lv ${level}`; xpEl.style.width = `${Math.min(100, xp/xpNeed(level)*100)}%`; lvEl.textContent = `LV ${level}`; xptEl.textContent = `${xp} / ${xpNeed(level)}`; }
  fpsT += dt; fpsN++;
  if (fpsT >= .5){
    const fps = fpsN/fpsT;
    slow = fps < 40 ? slow + 1 : 0;
    if (slow >= 2 && time > 2){
      slow = 0;
      if (DPR_CAP > 1){ DPR_CAP = 1; resize(); }
      else if (Q > .3){ Q = Math.max(.3, Q - .15); MAXP = Math.max(1000, MAXP*.75|0); }
    }
    statsEl.textContent = `처치 ${kills} · 지구 피격 ${earthHits} · 입자 ${parts.length.toLocaleString()} · ${Math.round(fpsN/fpsT)} fps`; fpsT = 0; fpsN = 0; }
}
requestAnimationFrame(frame);
})();
